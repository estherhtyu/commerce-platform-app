application:
  actions: actions
  runtimeManifest:
    packages:
      commerce-platform-app:
        license: Apache-2.0
        actions:
          commerce-api:
            function: actions/commerce-api/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          create-attribute:
            function: actions/product-attribute/create/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              MAGENTO_BASE_URL: $COMMERCE_BASE_URL
              OAUTH_CLIENT_ID: $OAUTH_CLIENT_ID
              OAUTH_CLIENT_SECRET: $OAUTH_CLIENT_SECRET
              OAUTH_TECHNICAL_ACCOUNT_ID: $OAUTH_TECHNICAL_ACCOUNT_ID
              OAUTH_TECHNICAL_ACCOUNT_EMAIL: $OAUTH_TECHNICAL_ACCOUNT_EMAIL
              OAUTH_IMS_ORG_ID: $OAUTH_IMS_ORG_ID
              OAUTH_SCOPES: $OAUTH_SCOPES
              TOKEN: $TOKEN
            annotations:
              require-adobe-auth: false
              final: true
