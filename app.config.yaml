application:
  actions: actions
  runtimeManifest:
    packages:
      commerce-platform-app:
        license: Apache-2.0
        actions:
          commerce-api:
            function: actions/commerce-api/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true
          import-products:
            function: actions/product-mass-load/actions/src/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              MAGENTO_BASE_URL: $COMMERCE_BASE_URL
              COMMERCE_BASE_URL: $COMMERCE_BASE_URL
              TOKEN: $TOKEN
              BATCH_SIZE: 50
              BATCH_CONCURRENCY: 3
              MAX_RETRY: 3
              POLL_INTERVAL_MS: 10000
              OAUTH_CLIENT_ID: $OAUTH_CLIENT_ID
              OAUTH_CLIENT_SECRET: $OAUTH_CLIENT_SECRET
              OAUTH_TECHNICAL_ACCOUNT_ID: $OAUTH_TECHNICAL_ACCOUNT_ID
              OAUTH_TECHNICAL_ACCOUNT_EMAIL: $OAUTH_TECHNICAL_ACCOUNT_EMAIL
              OAUTH_IMS_ORG_ID: $OAUTH_IMS_ORG_ID
              OAUTH_SCOPES: $OAUTH_SCOPES
            limits:
              timeout: 3600000
              memory: 512
              concurrency: 1
            annotations:
              require-adobe-auth: false
              final: true
          upload-csv:
            function: actions/product-mass-load/actions/src/uploadCsv.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            limits:
              timeout: 3600000
              memory: 512
              concurrency: 1
            annotations:
              require-adobe-auth: false
              final: true
